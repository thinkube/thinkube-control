apiVersion: thinkube.io/v1
kind: ThinkubeDeployment
metadata:
  # The application's version; the generated app starts at it.
  version: "0.1.0"

spec:
  deployment:
    type: extension

  # A part of Thinkube Control: Control lists it, draws its pages from the
  # module the frontend builds, and forwards the module's API calls to /api/v1
  extension:
    title: Mill
    description: "Data transformation tasks: their runs, progress and samples"
    icon: factory
    platform: "0.1"
    ui:
      module: /extension/index.js
      css: /extension/index.css
    nav:
      - label: Runs
        path: /
        icon: list-checks

  containers:
    # The main pod: it serves the control center and runs the light tasks
    # (calling models through the platform's services, cleaning data,
    # scoring), with no GPU
    - name: backend
      build: ./backend
      port: 8000
      size: medium
      health: /health
      test:
        enabled: true
        image: "python-base:3.12-slim"
        command: "./run_tests.sh"
        one: "./run_tests.sh <file>"
      migrations:
        tool: alembic
        auto: true
      # The shared file system at its root: the tasks repository is its
      # folder "mill", and the runs' records are inside it
      filesystems: [thinkube-shared]

    - name: frontend
      build: ./frontend
      port: 80
      size: small
      health: /health
      publicEnv:
        - APP_TITLE
      test:
        enabled: true
        # node-base carries git, which npm needs to install thinkube-style
        image: "node-base:22-alpine"
        command: "./run_tests.sh"
        one: "./run_tests.sh <file>"

  routes:
    - path: /api
      to: backend
    - path: /
      to: frontend

  services:
    - database
