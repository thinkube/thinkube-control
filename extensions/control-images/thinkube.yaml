apiVersion: thinkube.io/v1
kind: ThinkubeDeployment
metadata:
  # The application's version; the generated app starts at it.
  version: "0.1.2"

spec:
  deployment:
    type: extension

  # A part of Thinkube Control: Control lists it, draws its pages from the
  # module the frontend builds, and forwards the module's API calls to /api/v1
  extension:
    title: Images
    description: "Container images mirrored into Harbor, and custom images built from a Dockerfile"
    icon: container
    platform: "0.1"
    ui:
      module: /extension/index.js
      css: /extension/index.css
    nav:
      - label: Images
        path: /
        icon: container

  containers:
    - name: backend
      build: ./backend
      port: 8000
      size: medium
      health: /health
      test:
        enabled: true
        image: "python-base:3.12-slim"
        command: "./run_tests.sh"
        one: "./run_tests.sh <file>"
      migrations:
        tool: alembic
        auto: true
      # What Images reads and changes in the cluster: the workflows that
      # mirror and build images, which run in the namespace argo, with their
      # pods and logs; the image manifests the install writes as ConfigMaps;
      # the nodes, for their architectures; and every pod, to refuse the
      # delete of an image one of them runs
      access:
        - apiGroups: [argoproj.io]
          resources: [workflows]
          verbs: [create, get, list, delete]
        - apiGroups: [""]
          resources: [pods, nodes, configmaps]
          verbs: [list]
        - apiGroups: [""]
          resources: [pods/log]
          verbs: [get]
      # ~/dockerfiles of Thinkube IDE, where image definitions are edited
      filesystems: [dockerfiles]

    - name: frontend
      build: ./frontend
      port: 80
      size: small
      health: /health
      publicEnv:
        - APP_TITLE
      test:
        enabled: true
        # node-base carries git, which npm needs to install thinkube-style
        image: "node-base:22-alpine"
        command: "./run_tests.sh"
        one: "./run_tests.sh <file>"

  routes:
    - path: /api
      to: backend
    - path: /
      to: frontend

  services:
    - database
