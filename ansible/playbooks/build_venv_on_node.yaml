---
# ansible/playbooks/build_venv_on_node.yaml
# Description:
#   Builds a venv on a specific node via K8s Job.
#   Called by build_venv.yaml for each architecture.
#
# Required variables:
#   - target_build_node: Node hostname to build on
#   - target_build_arch: Architecture (arm64/amd64)
#   - venv_name: Venv name
#   - package_list: List of packages
#   - kubeconfig: Path to kubeconfig
#   - harbor_registry: Container registry
#   - venvs_host_path: Base path
#   - custom_venvs_subpath: Subpath for custom venvs
#   - job_namespace: Namespace for build jobs

# Where the venv lives and what its kernel is called. A template is one of
# the built-in venvs the notebook server installs from the release under
# <base>/<arch>/<name>; rebuilding it replaces that venv in place, so the
# kernel <name> keeps pointing at one venv. A custom venv lives under
# <base>/custom/<name>/<arch>.
- name: "Decide the venv location for {{ target_build_arch }}"
  ansible.builtin.set_fact:
    venv_rel_path: >-
      {{ target_build_arch ~ '/' ~ venv_name
         if (venv_is_template | default(false) | bool)
         else custom_venvs_subpath ~ '/' ~ venv_name ~ '/' ~ target_build_arch }}
    venv_display_name: >-
      {{ venv_name ~ ' (' ~ target_build_arch ~ ')'
         if (venv_is_template | default(false) | bool)
         else venv_name ~ ' (custom, ' ~ target_build_arch ~ ')' }}

- name: "Set the venv paths for {{ target_build_arch }}"
  ansible.builtin.set_fact:
    venv_host_dir: "{{ venvs_host_path }}/{{ venv_rel_path | trim }}"
    venv_pod_dir: "/home/thinkube/venvs/{{ venv_rel_path | trim }}"
    shadow_custom_dir: "{{ venvs_host_path }}/{{ custom_venvs_subpath }}/{{ venv_name }}"

# A Job's pod template cannot be changed, and a failed build keeps its Job
# for an hour: remove the previous one so this build can be created.
- name: "Remove the previous build Job for {{ target_build_arch }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: absent
    api_version: batch/v1
    kind: Job
    name: "venv-build-{{ venv_name | regex_replace('[^a-z0-9-]', '-') }}-{{ target_build_arch }}"
    namespace: "{{ job_namespace }}"
    delete_options:
      propagationPolicy: Foreground
    wait: true

- name: "Create build Job for {{ target_build_arch }} on {{ target_build_node }}"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: present
    definition:
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: "venv-build-{{ venv_name | regex_replace('[^a-z0-9-]', '-') }}-{{ target_build_arch }}"
        namespace: "{{ job_namespace }}"
        labels:
          app: jupyter-venv-builder
          venv-name: "{{ venv_name }}"
          architecture: "{{ target_build_arch }}"
      spec:
        ttlSecondsAfterFinished: 3600
        backoffLimit: 0
        template:
          spec:
            nodeSelector:
              kubernetes.io/hostname: "{{ target_build_node }}"
            restartPolicy: Never
            containers:
              - name: builder
                image: "{{ harbor_registry }}/library/tk-jupyter-base:latest"
                imagePullPolicy: Always
                command:
                  - bash
                  - -c
                  - |
                    set -e
                    ARCH=$(uname -m)
                    if [ "$ARCH" = "aarch64" ]; then
                      ARCH_NAME="arm64"
                    elif [ "$ARCH" = "x86_64" ]; then
                      ARCH_NAME="amd64"
                    else
                      ARCH_NAME="$ARCH"
                    fi

                    echo "=== Building venv: {{ venv_name }} (${ARCH_NAME}) ==="
                    VENV_PATH="{{ venv_host_dir }}"
                    mkdir -p "$(dirname "$VENV_PATH")"

                    rm -rf "$VENV_PATH" 2>/dev/null || true
                    {% if venv_is_template | default(false) | bool %}
                    # A template is rebuilt in place; a copy under custom/ would
                    # be registered under the same kernel name and shadow it.
                    rm -rf "{{ shadow_custom_dir }}" 2>/dev/null || true
                    {% endif %}

                    echo "Creating virtualenv at $VENV_PATH..."
                    python3 -m venv --system-site-packages "$VENV_PATH"

                    echo "Upgrading pip..."
                    "$VENV_PATH/bin/pip" install --upgrade pip

                    # Packages are installed in one resolution so pip can solve
                    # them together. Entries that carry their own pip flags are
                    # the exception: joined into one command their flags would
                    # apply to every package, so --no-deps on a single entry
                    # would silently leave the whole venv without dependencies.
                    # Those are installed individually instead.
                    echo "Installing packages..."
                    # Thinkube's own packages, such as tk-llm, are in Thinkube
                    # Packages, not on PyPI: the same index the install uses.
                    EXTRA_INDEX="--extra-index-url https://{{ devpi_api_hostname }}/root/{{ devpi_index_name }}/+simple/"
                    PKGS=({{ package_list | map('quote') | join(' ') }})
                    PLAIN=()
                    for p in "${PKGS[@]}"; do
                      case "$p" in
                        *" --"*)
                          echo "  (own flags) $p"
                          # deliberately unquoted: the flags must split into words
                          "$VENV_PATH/bin/pip" install $EXTRA_INDEX $p
                          ;;
                        *) PLAIN+=("$p") ;;
                      esac
                    done
                    if [ -n "${PLAIN[*]}" ]; then
                      "$VENV_PATH/bin/pip" install $EXTRA_INDEX "${PLAIN[@]}"
                    fi

                    echo "Installing ipykernel..."
                    "$VENV_PATH/bin/pip" install ipykernel

                    echo "$ARCH_NAME" > "$VENV_PATH/.arch"
                    echo "Architecture marker written: $ARCH_NAME"
                    echo "=== Build completed successfully ==="
                volumeMounts:
                  - name: venvs
                    mountPath: "{{ venvs_host_path }}"
                resources:
                  limits:
                    cpu: "4"
                    memory: "8Gi"
                  requests:
                    cpu: "1"
                    memory: "2Gi"
            volumes:
              - name: venvs
                hostPath:
                  path: "{{ venvs_host_path }}"
                  type: DirectoryOrCreate
  delegate_to: localhost
  register: arch_job_result

- name: "Wait for {{ target_build_arch }} Job to complete"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: batch/v1
    kind: Job
    namespace: "{{ job_namespace }}"
    name: "venv-build-{{ venv_name | regex_replace('[^a-z0-9-]', '-') }}-{{ target_build_arch }}"
  delegate_to: localhost
  register: arch_job_status
  until: >
    (arch_job_status.resources[0].status.succeeded | default(0) > 0) or
    (arch_job_status.resources[0].status.failed | default(0) > 0)
  retries: 60
  delay: 10

- name: "Check if {{ target_build_arch }} Job succeeded"
  ansible.builtin.fail:
    msg: "Venv build failed for {{ target_build_arch }}. Check: kubectl logs -n {{ job_namespace }} job/venv-build-{{ venv_name | regex_replace('[^a-z0-9-]', '-') }}-{{ target_build_arch }}"
  when: arch_job_status.resources[0].status.failed | default(0) > 0

# The backend reads this line to know which architectures the build produced.
- name: "Report the {{ target_build_arch }} build"
  ansible.builtin.debug:
    msg: "Architecture marker written: {{ target_build_arch }}"

- name: "Get {{ target_build_arch }} Job pod name"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: "{{ job_namespace }}"
    label_selectors:
      - "job-name=venv-build-{{ venv_name | regex_replace('[^a-z0-9-]', '-') }}-{{ target_build_arch }}"
  delegate_to: localhost
  register: arch_job_pods

- name: "Read {{ target_build_arch }} Job pod logs"
  kubernetes.core.k8s_log:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: "{{ job_namespace }}"
    name: "{{ arch_job_pods.resources[0].metadata.name }}"
  delegate_to: localhost
  register: arch_job_logs
  when: arch_job_pods.resources | length > 0

- name: "Display {{ target_build_arch }} build logs"
  ansible.builtin.debug:
    msg: "{{ arch_job_logs.log_lines | default(['No logs available']) }}"

# The Job's pod goes with it; without the cascade a completed pod stays.
- name: "Clean up {{ target_build_arch }} Job"
  kubernetes.core.k8s:
    kubeconfig: "{{ kubeconfig }}"
    state: absent
    api_version: batch/v1
    kind: Job
    namespace: "{{ job_namespace }}"
    name: "venv-build-{{ venv_name | regex_replace('[^a-z0-9-]', '-') }}-{{ target_build_arch }}"
    delete_options:
      propagationPolicy: Background
  delegate_to: localhost

- name: "Sync {{ target_build_arch }} venv to other nodes of same arch"
  ansible.builtin.include_tasks: sync_venv_tasks.yaml
  vars:
    source_node: "{{ target_build_node }}"
    filter_architecture: "{{ target_build_arch }}"
    sync_dir: "{{ venv_host_dir }}"
    remove_dir: "{{ shadow_custom_dir if (venv_is_template | default(false) | bool) else '' }}"
  when: groups['baremetal_gpus'] | length > 1

- name: "Find running Jupyter pods for {{ target_build_arch }}"
  kubernetes.core.k8s_info:
    kubeconfig: "{{ kubeconfig }}"
    api_version: v1
    kind: Pod
    namespace: jupyterhub
    label_selectors:
      - "component=singleuser-server"
    field_selectors:
      - "status.phase=Running"
  delegate_to: localhost
  register: running_jupyter_pods

- name: "Filter Jupyter pods on {{ target_build_arch }} nodes"
  ansible.builtin.set_fact:
    matching_jupyter_pods: >-
      {%- set pods = [] -%}
      {%- for pod in running_jupyter_pods.resources -%}
        {%- set node_name = pod.spec.nodeName -%}
        {%- for node in all_nodes.resources -%}
          {%- if node.metadata.name == node_name and node.metadata.labels['kubernetes.io/arch'] == target_build_arch -%}
            {%- set _ = pods.append(pod.metadata.name) -%}
          {%- endif -%}
        {%- endfor -%}
      {%- endfor -%}
      {{ pods }}
  when: running_jupyter_pods.resources | length > 0

- name: "Register kernel in running Jupyter pod {{ item }}"
  kubernetes.core.k8s_exec:
    kubeconfig: "{{ kubeconfig }}"
    namespace: jupyterhub
    pod: "{{ item }}"
    container: notebook
    command: >-
      {{ venv_pod_dir }}/bin/python
      -m ipykernel install
      --prefix=/home/thinkube/venvs
      --name={{ venv_name }}
      --display-name={{ venv_display_name | trim }}
  delegate_to: localhost
  loop: "{{ matching_jupyter_pods | default([]) }}"
  ignore_errors: true
  when: matching_jupyter_pods | default([]) | length > 0

- name: "Report kernel registration for {{ target_build_arch }}"
  ansible.builtin.debug:
    msg: "Registered kernel '{{ venv_name }}' in {{ matching_jupyter_pods | default([]) | length }} running Jupyter pod(s)"
